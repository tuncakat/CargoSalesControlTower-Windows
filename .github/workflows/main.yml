name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract Windows source
        shell: powershell
        run: |
          Expand-Archive -Path "CargoSalesControlTower_Windows_Source_v10_30.zip" -DestinationPath "app" -Force

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r app\requirements.txt
          pip install pyinstaller pillow

      - name: Create Windows icon
        shell: powershell
        run: |
          python -c "from PIL import Image; img=Image.open(r'app\assets\aircraft_brand_emblem.png').convert('RGBA'); img.save(r'app\assets\app_icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build EXE
        shell: powershell
        working-directory: app
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "CargoSalesControlTower" `
            --icon "assets\app_icon.ico" `
            --add-data "assets;assets" `
            --collect-all PySide6 `
            main.py

      - name: Package Windows app
        shell: powershell
        run: |
          Compress-Archive `
            -Path "app\dist\CargoSalesControlTower\*" `
            -DestinationPath "CargoSalesControlTower_Windows_v10_30.zip" `
            -Force

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CargoSalesControlTower-Windows-v10.30
          path: CargoSalesControlTower_Windows_v10_30.zip
          if-no-files-found: error
